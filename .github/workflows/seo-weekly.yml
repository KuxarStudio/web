name: SEO weekly report

# Informe SEO semanal por correo (Search Console + citaciones de IA).
# El histórico vive en la rama `seo-data`, no en `main`, para no disparar el
# despliegue de la web. Secretos necesarios (Settings → Secrets → Actions):
#   GSC_SERVICE_ACCOUNT_JSON, GEMINI_API_KEY, RESEND_API_KEY, SEO_REPORT_TO
on:
  schedule:
    - cron: "17 6 * * 1" # lunes ~08:17 (Madrid, horario de verano; 07:17 en invierno)
    # Respaldo: GitHub a veces retrasa o se salta ejecuciones programadas. Estas dos solo
    # actúan si esta semana aún no hay snapshot (ver paso "Skip if already sent").
    - cron: "47 9 * * 1" # lunes de respaldo
    - cron: "47 6 * * 2" # martes de respaldo
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar el informe (no envía correo ni guarda histórico)"
        type: boolean
        default: true
      no_citations:
        description: "Omitir el módulo de citaciones de IA"
        type: boolean
        default: false

concurrency:
  group: seo-weekly
  cancel-in-progress: false

permissions:
  contents: write # solo para empujar el histórico a la rama seo-data

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/seo-agent
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      NO_CITATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.no_citations || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/seo-agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch history (branch seo-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" seo-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch seo-data "$remote" data
          else
            mkdir -p data
            git -C data init --quiet -b seo-data
            git -C data remote add origin "$remote"
          fi

      - name: Skip if already sent this week
        id: gate
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          monday=$(date -u -d "monday this week" +%F)
          [ "$(date -u +%u)" = "1" ] && monday=$(date -u +%F)
          last=$(ls data/snapshots 2>/dev/null | sed 's/\.json$//' | sort | tail -1 || true)
          echo "Lunes de esta semana: $monday · último snapshot: ${last:-ninguno}"
          if [ -n "$last" ] && [[ ! "$last" < "$monday" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ya hay informe de esta semana: no se repite."
          fi

      - name: Run agent
        if: steps.gate.outputs.skip != 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEO_REPORT_TO: ${{ secrets.SEO_REPORT_TO }}
        run: |
          args=(run --data-dir data --out-dir out)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$NO_CITATIONS" = "true" ] && args+=(--no-citations)
          python -m seo_agent "${args[@]}"

      - name: Upload report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seo-report
          path: tools/seo-agent/out/
          if-no-files-found: ignore

      - name: Save history
        if: env.DRY_RUN != 'true' && steps.gate.outputs.skip != 'true'
        working-directory: tools/seo-agent/data
        run: |
          set -euo pipefail
          git add snapshots
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git -c user.name="kuxar-seo-agent" -c user.email="noreply@users.noreply.github.com" \
            commit --quiet -m "seo: snapshot $(date -u +%F)"
          git push --quiet origin HEAD:seo-data
