name: CI

# Comprueba cada PR antes de fusionar: tipos, tests, build y auditoría SEO
# (enlaces rotos, estructura, accesibilidad básica y paridad con el mapa de temas).
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tools/seo-agent/topic-map.yaml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Astro 7 exige Node >= 22.23.4: sin esto el runner puede usar un 22.x antiguo de su caché.
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SEO audit
        working-directory: web
        run: npm run audit

      # QA visual y de accesibilidad: axe-core (WCAG 2.2 AA) en todas las páginas,
      # móvil y escritorio, claro y oscuro, más capturas de las páginas clave.
      # Falla con errores serios/críticos o scroll horizontal. Informe en el
      # "Job summary" y capturas en el artefacto `visual-qa`.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Visual & accessibility QA
        working-directory: web
        run: npm run qa

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa
          path: web/.visual-qa/
          retention-days: 14
          if-no-files-found: warn
          # .visual-qa empieza por punto: upload-artifact omite lo oculto por defecto.
          include-hidden-files: true
