name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # El agente SEO no forma parte del sitio: no hace falta redesplegar por él.
    paths-ignore:
      - 'tools/**'
      - '.github/workflows/seo-weekly.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # GITHUB_TOKEN is required here by src/lib/github.ts (build-time repo stats) — scoped to contents:read only via this job's minimal permissions above, so leakage risk is bounded to read access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Analytics 4 measurement ID (e.g. G-XXXXXXX). Public by nature (ends up in
          # the page source), but kept as a repo variable so it's not hardcoded. Analytics.astro
          # simply skips rendering the GA4 snippet if this is unset — safe to leave empty.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          # Access key de Web3Forms para el formulario de contacto (ver web/.env.example)
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}

      # Frena el despliegue si hay enlaces rotos, páginas sin título/h1/lang o el sitio
      # se desvía del mapa de temas (tools/seo-agent/topic-map.yaml).
      - name: SEO audit
        working-directory: web
        run: npm run audit

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Avisa a Bing y demás buscadores IndexNow de las URLs que han cambiado (ChatGPT Search y
  # Copilot se apoyan en el índice de Bing). No es crítico: si falla, el despliegue sigue verde.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Notify IndexNow
        run: node web/scripts/indexnow/run.mjs --before "${{ github.event.before }}" --after "${{ github.sha }}"
